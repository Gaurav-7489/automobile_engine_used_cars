openapi: 3.1.0
info:
  title: VandLabs Automobile Engine BFF
  version: 1.0.0
  description: >
    Proof-of-Engine HTTP contracts. These endpoints are implemented by the
    Next.js BFF today and can later proxy API Gateway/domain services without
    changing customer-facing UI contracts.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/health:
    get:
      summary: Read demo BFF health
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  version: { type: string }
                  persistence: { type: string }
  /api/vehicles:
    get:
      summary: List published vehicles
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: body
          schema: { type: string }
        - in: query
          name: fuel
          schema:
            type: string
            enum: [petrol, diesel, hybrid, electric]
      responses:
        "200":
          description: Published vehicles matching the filters
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vehicle" }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      sourceOfTruth: { type: string }
  /api/vehicles/{slug}:
    get:
      summary: Get one published vehicle
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Vehicle" }
        "404":
          description: Unknown or unpublished vehicle
  /api/leads:
    post:
      summary: Create a structured automotive lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLead" }
      responses:
        "201":
          description: Lead accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  leadId: { type: string }
                  stage: { type: string, const: new }
                  vehicleId: { type: [string, "null"] }
                  message: { type: string }
        "400":
          description: Invalid lead payload
  /api/events:
    post:
      summary: Accept a first-party journey event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyEventInput" }
      responses:
        "202":
          description: Event accepted
        "400":
          description: Invalid event
  /command/api/leads/{id}:
    patch:
      summary: Update lead stage, owner, or internal notes
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLead" }
      responses:
        "200":
          description: Lead updated and activity recorded
        "400":
          description: Invalid lead update
        "404":
          description: Lead not found in the active tenant
  /command/api/leads/{id}/tasks:
    post:
      summary: Schedule a human follow-up for a lead
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFollowUp" }
      responses:
        "201":
          description: Follow-up scheduled and activity recorded
        "400":
          description: Invalid follow-up
        "404":
          description: Lead not found in the active tenant
  /command/api/tasks/{id}:
    patch:
      summary: Complete or reopen a follow-up task
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200":
          description: Follow-up state updated and activity recorded
        "400":
          description: Invalid task state
        "404":
          description: Task not found in the active tenant
  /command/api/leads/{id}/appointments:
    post:
      summary: Schedule a staff-confirmed visit and internal reminder
      description: Requires lead-write and task-write capability within the lead location.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, scheduledAt]
              properties:
                type: { type: string, enum: [appointment, test_drive] }
                scheduledAt: { type: string, format: date-time, description: Future UTC instant }
      responses:
        "201": { description: Scheduled with reminder and audit record }
        "400": { description: Invalid schedule or unavailable vehicle }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Lead not in scope }
  /command/api/appointments/{id}:
    patch:
      summary: Record visit or test-drive status
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [scheduled, completed, cancelled, no_show] }
      responses:
        "200": { description: Status and audit recorded }
        "400": { description: Invalid status }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Appointment not in scope }
  /command/api/leads/{id}/sales:
    post:
      summary: Confirm a verified sale and withdraw owned inventory atomically
      description: Requires lead-write and inventory-write in scope. Repeating identical details returns the same sale; conflicting details return 409. Closes open follow-ups. Sale proceeds are not profit.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, soldAt]
              properties:
                amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
                soldAt: { type: string, format: date-time, description: Actual non-future UTC sale time }
      responses:
        "201": { description: Confirmed sale or identical retry }
        "400": { description: Invalid price/date or no vehicle }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Lead/vehicle not in scope }
        "409": { description: Conflicting sale or vehicle already sold }
  /command/api/vehicles/{id}:
    patch:
      summary: Update stock price and publication with audit history
      description: Requires inventory-write in scope. A confirmed sale cannot be reopened with this endpoint.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price, availabilityStatus, publishStatus]
              properties:
                price: { type: number, minimum: 0 }
                availabilityStatus: { type: string, enum: [available, reserved, sold] }
                publishStatus: { type: string, enum: [draft, published, archived] }
      responses:
        "200": { description: Stock and history updated }
        "400": { description: Invalid stock change }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Vehicle not in scope }
        "409": { description: Confirmed sale requires approved reversal }
components:
  schemas:
    Vehicle:
      type: object
      required:
        - id
        - slug
        - tenantId
        - dealershipId
        - locationId
        - make
        - model
        - variant
        - year
        - price
        - mileage
        - availabilityStatus
        - publishStatus
      properties:
        id: { type: string }
        slug: { type: string }
        tenantId: { type: string }
        dealershipId: { type: string }
        locationId: { type: string }
        stockId: { type: string }
        make: { type: string }
        model: { type: string }
        variant: { type: string }
        year: { type: integer }
        price: { type: number }
        mileage: { type: number }
        fuelType:
          type: string
          enum: [petrol, diesel, hybrid, electric]
        transmission:
          type: string
          enum: [manual, automatic]
        availabilityStatus:
          type: string
          enum: [available, reserved, sold]
        publishStatus:
          type: string
          enum: [draft, published, archived]
    CreateLead:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string }
        intent:
          type: string
          enum: [enquiry, test_drive, finance, exchange]
        vehicleId: { type: string }
        notes: { type: string }
        whatsappConsent: { type: boolean }
        marketingConsent: { type: boolean }
        attribution:
          type: object
          additionalProperties: true
    JourneyEventInput:
      type: object
      required: [type, sessionId]
      properties:
        type:
          type: string
          enum:
            - page_view
            - inventory_search
            - vehicle_view
            - compare
            - whatsapp_click
            - call_click
            - lead_created
            - test_drive_requested
            - finance_interest
            - exchange_interest
        sessionId: { type: string }
        path: { type: string }
        vehicleId: { type: string }
        source: { type: string }
        campaign: { type: string }
    UpdateLead:
      type: object
      properties:
        stage:
          type: string
          enum: [new, contacted, qualified, appointment, visited, test_drive, negotiation, won, lost, nurture]
        assignedTo: { type: [string, "null"], maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
    CreateFollowUp:
      type: object
      required: [title, owner, dueAt, priority]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 100 }
        dueAt: { type: string, format: date-time }
        priority: { type: string, enum: [normal, high] }
