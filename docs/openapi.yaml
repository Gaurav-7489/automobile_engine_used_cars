openapi: 3.1.0
info:
  title: VandLabs Automobile Engine BFF
  version: 1.2.0
  description: >
    Proof-of-Engine HTTP contracts. These endpoints are implemented by the
    Next.js BFF today and can later proxy API Gateway/domain services without
    changing customer-facing UI contracts.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/health:
    get:
      summary: Read public application liveness
      responses:
        "200":
          description: Liveness and selected adapter only; does not certify database readiness
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  version: { type: string }
                  persistence: { type: string }
  /api/vehicles:
    get:
      summary: List published vehicles
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: body
          schema: { type: string }
        - in: query
          name: fuel
          schema:
            type: string
            enum: [petrol, diesel, hybrid, electric]
      responses:
        "200":
          description: Published vehicles matching the filters
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vehicle" }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      sourceOfTruth: { type: string }
  /api/vehicles/{slug}:
    get:
      summary: Get one published vehicle
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Vehicle" }
        "404":
          description: Unknown or unpublished vehicle
  /api/leads:
    post:
      summary: Create a structured automotive lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLead" }
      responses:
        "201":
          description: Lead accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  leadId: { type: string }
                  stage: { type: string, const: new }
                  vehicleId: { type: [string, "null"] }
                  vehicleIds: { type: array, maxItems: 3, items: { type: string } }
                  message: { type: string }
        "400":
          description: Invalid lead payload, non-JSON content type or body exceeding 16 KiB
        "403":
          description: Foreign browser origin or hosted reference preview writes disabled
        "429":
          description: Submission limit exceeded; Retry-After supplies seconds
        "503":
          description: Hosted shared limiter is not configured or unavailable
  /api/events:
    post:
      summary: Accept a first-party journey event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyEventInput" }
      responses:
        "202":
          description: Event accepted
        "400":
          description: Invalid event, non-JSON content type or body exceeding 8 KiB
        "403":
          description: Foreign browser origin or hosted reference preview writes disabled
        "429":
          description: Event limit exceeded; Retry-After supplies seconds
        "503":
          description: Hosted shared limiter is not configured or unavailable
  /api/downloads/{platform}:
    get:
      summary: Download a verified Windows or macOS development installer
      description: >
        Selects only a complete published prerelease from the fixed project
        repository, bound to a tested commit. Builds are unsigned development
        distributions; live backend activation and installed acceptance remain required.
      parameters:
        - in: path
          name: platform
          required: true
          schema: { type: string, enum: [windows, mac] }
      responses:
        "307":
          description: Redirect to the verified GitHub installer asset
          headers:
            Location:
              schema: { type: string, format: uri }
        "404":
          description: Unsupported platform
        "503":
          description: A complete installer release is not available; Retry-After is 300 seconds
  /command/api/desktop-config:
    get:
      summary: Discover public native sign-in settings for an activated workspace
      servers:
        - url: http://127.0.0.1:3001
      description: >
        Intentionally public. Contains only public HTTPS API and Cognito origins
        and the native public client ID; no staff grant, secret or operational data.
        The native client validates same-origin binding and still requires PKCE
        login plus verified-token authorization for staff APIs.
      responses:
        "200":
          description: Public desktop connection settings
          content:
            application/json:
              schema:
                type: object
                required: [apiOrigin, cognitoDomain, clientId]
                properties:
                  apiOrigin: { type: string, format: uri }
                  cognitoDomain: { type: string, format: uri }
                  clientId: { type: string }
        "503":
          description: Shared Cognito and Aurora workspace access is not activated
  /command/api/leads/{id}:
    patch:
      summary: Update lead stage, owner, or internal notes
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLead" }
      responses:
        "200":
          description: Lead updated and activity recorded
        "400":
          description: Invalid lead update
        "409":
          description: Stale version or confirmed sale requires approved reversal
        "404":
          description: Lead not found in the active tenant
  /command/api/leads/{id}/tasks:
    post:
      summary: Schedule a human follow-up for a lead
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFollowUp" }
      responses:
        "201":
          description: Follow-up scheduled and activity recorded
        "400":
          description: Invalid follow-up
        "404":
          description: Lead not found in the active tenant
  /command/api/tasks/{id}:
    patch:
      summary: Complete or reopen a follow-up task
      servers:
        - url: http://127.0.0.1:3001
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed, expectedVersion]
              properties:
                completed: { type: boolean }
                expectedVersion: {type: integer, minimum: 0}
      responses:
        "200":
          description: Follow-up state updated and activity recorded
        "400":
          description: Invalid task state
        "409":
          description: Stale version or follow-up closed by a confirmed sale
        "404":
          description: Task not found in the active tenant
  /command/api/leads/{id}/appointments:
    post:
      summary: Schedule a staff-confirmed visit and internal reminder
      description: Requires lead-write and task-write capability within the lead location.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, scheduledAt]
              properties:
                type: { type: string, enum: [appointment, test_drive] }
                scheduledAt: { type: string, format: date-time, description: Future UTC instant }
      responses:
        "201": { description: Scheduled with reminder and audit record }
        "400": { description: Invalid schedule or unavailable vehicle }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Lead not in scope }
  /command/api/appointments/{id}:
    patch:
      summary: Record visit or test-drive status
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [scheduled, completed, cancelled, no_show] }
      responses:
        "200": { description: Status and audit recorded }
        "400": { description: Invalid status }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Appointment not in scope }
  /command/api/leads/{id}/sales:
    post:
      summary: Confirm a verified sale and withdraw owned inventory atomically
      description: Requires lead-write and inventory-write in scope. Repeating identical details returns the same sale; conflicting details return 409. Closes open follow-ups. Sale proceeds are not profit.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, soldAt]
              properties:
                amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
                soldAt: { type: string, format: date-time, description: Actual non-future UTC sale time }
      responses:
        "201": { description: Confirmed sale or identical retry }
        "400": { description: Invalid price/date or no vehicle }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Lead/vehicle not in scope }
        "409": { description: Conflicting sale or vehicle already sold }
  /command/api/vehicles:
    post:
      summary: Create one tenant-scoped draft vehicle with an atomic creation audit
      servers: [{ url: "http://127.0.0.1:3001" }]
      description: Requires inventory-write and assigned dealership/location. Identity/publication are server controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealershipId, locationId, vehicle]
              properties:
                dealershipId: {type: string}
                locationId: {type: string}
                vehicle: {$ref: "#/components/schemas/InventoryInput"}
      responses:
        "201": {description: Draft and creation audit committed}
        "400": {description: Validation issues with row and field}
        "401": {description: Authentication required}
        "403": {description: Capability or location denied}
        "409": {description: Concurrent identity conflict}
  /command/api/vehicles/import:
    post:
      summary: Preview or commit a batch of new CSV stock identities
      servers: [{ url: "http://127.0.0.1:3001" }]
      description: CSV maximum 250000 UTF-8 bytes and 200 records. Preview does not write; commit revalidates and is atomic. Duplicates do not overwrite existing stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealershipId, locationId, csv, mode]
              properties:
                dealershipId: {type: string}
                locationId: {type: string}
                csv: {type: string}
                mode: {type: string, enum: [preview, commit]}
      responses:
        "200": {description: Transient preview records; no writes}
        "201": {description: Batch committed with creation audits}
        "400": {description: Invalid CSV or row-field issues, including duplicate identities}
        "401": {description: Authentication required}
        "403": {description: Capability or location denied}
        "409": {description: Concurrent identity conflict}
  /command/api/vehicles/{id}:
    put:
      summary: Edit canonical vehicle details while preserving identity, scope and state
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle, expectedVersion]
              properties:
                vehicle: {$ref: "#/components/schemas/InventoryInput"}
                expectedVersion: {type: integer, minimum: 0}
      responses:
        "200": {description: Updated metadata and before/after audit}
        "400": {description: Invalid fields, changed stock ID or missing publication imagery}
        "401": {description: Authentication required}
        "403": {description: Capability or location denied}
        "404": {description: Vehicle not found in active tenant}
        "409": {description: Stale inventory version or sold inventory requires an approved correction}
    patch:
      summary: Update stock price and publication with audit history
      description: Requires inventory-write in scope. A confirmed sale cannot be reopened with this endpoint.
      servers: [{ url: "http://127.0.0.1:3001" }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price, availabilityStatus, publishStatus, expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                price: { type: number, minimum: 0 }
                availabilityStatus: { type: string, enum: [available, reserved, sold] }
                publishStatus: { type: string, enum: [draft, published, archived] }
      responses:
        "200": { description: Stock and history updated }
        "400": { description: Invalid stock change }
        "401": { description: Authentication required }
        "403": { description: Scope or capability denied }
        "404": { description: Vehicle not in scope }
        "409": { description: Stale inventory version or confirmed sale requires approved reversal }
  /command/api/vehicles/{id}/costs:
    put:
      summary: Save an operator-verified stock cost record and immutable amendment history
      servers: [{url: "http://127.0.0.1:3001"}]
      description: Requires capital-write and vehicle dealership/location scope. Version zero creates; subsequent saves require the current version.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, record]
              properties:
                expectedVersion: {type: integer, minimum: 0}
                record:
                  type: object
                  additionalProperties: false
                  required: [acquiredOn, purchasePrice, reconditioningCost, transferCost, otherCost, dailyHoldingCost, reference]
                  properties:
                    acquiredOn: {type: string, format: date, description: Asia/Kolkata business date, not future or after confirmed sale}
                    purchasePrice: {type: number, exclusiveMinimum: 0, maximum: 999999999999, multipleOf: 0.01}
                    reconditioningCost: {type: number, minimum: 0, maximum: 999999999999, multipleOf: 0.01}
                    transferCost: {type: number, minimum: 0, maximum: 999999999999, multipleOf: 0.01}
                    otherCost: {type: number, minimum: 0, maximum: 999999999999, multipleOf: 0.01}
                    dailyHoldingCost: {type: [number, "null"], minimum: 0, maximum: 999999999999, multipleOf: 0.01}
                    reference: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200": {description: Cost version and audit atomically saved}
        "400": {description: Invalid values or protected fields}
        "401": {description: Authentication required}
        "403": {description: Capital permission or vehicle scope denied}
        "404": {description: Vehicle not found in active tenant}
        "409": {description: Stale cost version; refresh required}
  /command/api/readiness:
    get:
      summary: Check authenticated configuration and tenant-scoped database reads
      servers: [{url: "http://127.0.0.1:3001"}]
      description: Returns only redacted configuration states. Requires lead-read. A local reference adapter is never shared-ready.
      responses:
        "200": {description: Configuration and tenant-isolated read passed}
        "401": {description: Authentication required}
        "403": {description: Capability or scope denied}
        "503": {description: Configuration, connectivity, migration or provisioning is incomplete}
  /platform/api/snapshot:
    get:
      summary: Read authorized organizations, live counts, staff grants and recent audit
      servers: [{url: "http://127.0.0.1:3002"}]
      description: Requires platform-admin and server-owned tenant scopes. Every organization read uses forced tenant RLS. Response is private and uncached.
      responses:
        "200": {description: Authorized tenant snapshots in data array}
        "401": {description: Authentication required}
        "403": {description: Platform capability or tenant scope denied}
        "404": {description: Authorized organization is not provisioned}
        "503": {description: Authentication or database configuration unavailable}
  /platform/api/readiness:
    get:
      summary: Check authenticated configuration and authorized Platform table reads
      servers: [{url: "http://127.0.0.1:3002"}]
      responses:
        "200": {description: Shared configuration and authorized tenant reads passed}
        "401": {description: Authentication required}
        "403": {description: Platform capability or tenant scope denied}
        "503": {description: Configuration, connectivity, migration or provisioning is incomplete}
  /platform/api/staff:
    post:
      summary: Create or amend a scoped staff grant with atomic audit
      servers: [{url: "http://127.0.0.1:3002"}]
      description: Requires platform-admin for the specified server-authorized tenant. Cognito subject must already exist. Self-change is rejected. Database-registry revocation takes effect on the next verified request. This endpoint never creates an identity or changes bootstrap environment grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, member, expectedVersion]
              properties:
                tenantId: {type: string}
                expectedVersion: {type: integer, minimum: 0, description: Zero for first grant; current persisted version for amendment}
                member:
                  type: object
                  required: [userId, displayName, role, dealershipIds, locationIds, enabled]
                  properties:
                    userId: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$', description: Verified Cognito subject ID}
                    displayName: {type: string, minLength: 1, maxLength: 120}
                    role: {type: string, enum: [owner, manager, sales, viewer]}
                    dealershipIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
                    locationIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
                    enabled: {type: boolean}
      responses:
        "200": {description: Versioned grant and immutable audit committed together}
        "400": {description: Invalid role, subject, hierarchy, version or prohibited self-change}
        "401": {description: Authentication required}
        "403": {description: Platform capability or tenant scope denied}
        "404": {description: Organization is not provisioned}
        "409": {description: Grant changed since it was loaded}
        "503": {description: Staff authentication is unconfigured or hosted reference writes disabled}
components:
  schemas:
    Vehicle:
      type: object
      required:
        - id
        - slug
        - tenantId
        - dealershipId
        - locationId
        - make
        - model
        - variant
        - year
        - price
        - mileage
        - availabilityStatus
        - publishStatus
      properties:
        id: { type: string }
        slug: { type: string }
        tenantId: { type: string }
        dealershipId: { type: string }
        locationId: { type: string }
        stockId: { type: string }
        make: { type: string }
        model: { type: string }
        variant: { type: string }
        year: { type: integer }
        price: { type: number }
        mileage: { type: number }
        fuelType:
          type: string
          enum: [petrol, diesel, hybrid, electric]
        transmission:
          type: string
          enum: [manual, automatic]
        availabilityStatus:
          type: string
          enum: [available, reserved, sold]
        publishStatus:
          type: string
          enum: [draft, published, archived]
    InventoryInput:
      type: object
      additionalProperties: false
      required: [stockId, make, model, variant, year, price, mileage, fuelType, transmission, ownership, bodyType, condition, exteriorColor, interiorColor]
      properties:
        stockId: {type: string, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}
        make: {type: string, minLength: 1, maxLength: 120}
        model: {type: string, minLength: 1, maxLength: 120}
        variant: {type: string, minLength: 1, maxLength: 120}
        year: {type: integer, minimum: 1900, description: No later than the current year plus one}
        price: {type: number, exclusiveMinimum: 0, maximum: 999999999999, multipleOf: 0.01}
        mileage: {type: integer, minimum: 0, maximum: 2000000}
        fuelType: {type: string, enum: [petrol, diesel, hybrid, electric]}
        transmission: {type: string, enum: [manual, automatic]}
        ownership: {type: integer, minimum: 1, maximum: 20}
        bodyType: {type: string, minLength: 1, maxLength: 120}
        condition: {type: string, enum: [excellent, good, fair]}
        exteriorColor: {type: string, minLength: 1, maxLength: 120}
        interiorColor: {type: string, minLength: 1, maxLength: 120}
        imageUrl: {type: string, maxLength: 2048, description: Optional public HTTPS image URL without credentials; empty permitted for drafts}
        financeEligible: {type: boolean, default: false}
        exchangeEligible: {type: boolean, default: false}
    CreateLead:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string }
        intent:
          type: string
          enum: [enquiry, test_drive, finance, exchange]
        vehicleId: { type: string, maxLength: 100 }
        vehicleIds:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 100 }
          description: Published vehicles in the active dealership. Unique combined interests including the primary vehicle must not exceed three. The primary vehicle must be available.
        notes: { type: string, maxLength: 2000 }
        whatsappConsent: { type: boolean }
        marketingConsent: { type: boolean }
        attribution:
          type: object
          additionalProperties: true
    JourneyEventInput:
      type: object
      required: [type, sessionId]
      properties:
        type:
          type: string
          enum:
            - page_view
            - inventory_search
            - vehicle_view
            - compare
            - whatsapp_click
            - call_click
            - lead_created
            - test_drive_requested
            - finance_interest
            - exchange_interest
        sessionId: { type: string }
        path: { type: string }
        vehicleId: { type: string }
        source: { type: string }
        campaign: { type: string }
    UpdateLead:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        stage:
          type: string
          enum: [new, contacted, qualified, appointment, visited, test_drive, negotiation, won, lost, nurture]
        assignedTo: { type: [string, "null"], maxLength: 100 }
        notes: { type: string, maxLength: 2000 }
    CreateFollowUp:
      type: object
      required: [title, owner, dueAt, priority]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        owner: { type: string, minLength: 1, maxLength: 100 }
        dueAt: { type: string, format: date-time }
        priority: { type: string, enum: [normal, high] }
