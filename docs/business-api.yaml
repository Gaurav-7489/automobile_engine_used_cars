openapi: 3.1.0
info:
  title: VandLabs Dealer Intelligence API
  version: 1.0.0
  description: Tenant-scoped access to authorized sourcing and acquisition data. A key does not grant redistribution rights to restricted sources. Commercial prices are configured separately from access tiers.
servers:
  - url: /command/api/v1
security:
  - businessKey: []
paths:
  /vehicles:
    get:
      summary: List available, unexpired vehicles with API redistribution rights
      parameters:
        - { name: city, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 2000, default: 0 } }
      responses:
        '200': { description: Vehicle records with source attribution and observation times; internal evidence notes and seller contacts excluded }
        '401': { description: Invalid, revoked or expired key }
        '402': { description: Inactive or expired dealership subscription }
        '403': { description: vehicles:read scope required }
        '429': { description: Shared tenant quota or minute rate reached; Retry-After supplied for minute limits }
  /fuel-prices:
    get:
      summary: Return timestamped source observations of petrol or diesel prices
      parameters:
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200': { description: Unexpired observations with redistribution rights; missing data returns an empty list }
        '401': { description: Invalid key }
        '402': { description: Inactive subscription }
        '403': { description: fuel:read scope required }
        '429': { description: Tenant quota or rate reached }
  /recommendations:
    post:
      summary: Rank feasible one-car or two-car acquisitions by location, capital and evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquisitionRequest' }
      responses:
        '200': { description: Ranked options, costs, contribution ranges, unknown evidence, notices and quota usage }
        '400': { description: Invalid constraints or more than 200 eligible candidates; narrow the search }
        '401': { description: Invalid key }
        '402': { description: Inactive subscription }
        '403': { description: recommendations:read scope or subscription entitlement required }
        '429': { description: Tenant quota or rate reached }
components:
  securitySchemes:
    businessKey:
      type: http
      scheme: bearer
      description: One-time displayed VandLabs business API key. Send server-to-server; never include in URLs or browser bundles.
  schemas:
    AcquisitionRequest:
      type: object
      required: [budget, reserve, city, latitude, longitude, radiusKm, count, goal, transportPerKm, dailyHoldingCost, holdingDays, fuel, annualKm]
      properties:
        budget: { type: integer, minimum: 1, maximum: 100000000, description: Total INR acquisition capital }
        reserve: { type: integer, minimum: 0, description: Cash reserve; cannot exceed budget }
        city: { type: string, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusKm: { type: number, minimum: 0, maximum: 3000 }
        count: { type: integer, enum: [1, 2] }
        goal: { type: string, enum: [margin, demand] }
        fuel: { type: string, enum: [any, petrol, diesel, hybrid, electric] }
        transportPerKm: { type: number, minimum: 0, maximum: 1000 }
        dailyHoldingCost: { type: number, minimum: 0, maximum: 10000 }
        holdingDays: { type: integer, minimum: 0, maximum: 365 }
        annualKm: { type: integer, minimum: 0, maximum: 200000 }
