packages:
  - "apps/*"
  - "packages/*"
  - "infra/cloudflare"
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - workerd
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true
# Security patches for transitive dependencies whose parents pin vulnerable versions (pnpm audit).
overrides:
  "next>postcss": "^8.5.23"
  "@opennextjs/cloudflare>glob": "^14.0.6"
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.8"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  "qs@>=6.7.0 <6.16.1": "^6.16.1"
  "undici@>=6.0.0 <6.29.1": "^6.29.1"
