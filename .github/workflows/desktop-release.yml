name: Publish desktop development release
on:
  workflow_run:
    workflows: ['Quality Gate']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  installers:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
        if: runner.os == 'macOS'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf rpm file
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vandlabs/desktop typecheck
      - name: Native regressions
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build installer from tested source
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/rpm/*.rpm
  publish:
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Prepare checksums and publish a development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          tag="desktop-${TESTED_SHA:0:12}"
          one() { mapfile -t f < <(find installers -name "$1"); test "${#f[@]}" = 1; cp "${f[0]}" "$2"; }
          one '*.exe' Automobile-Engine-Windows-x64.exe
          one '*.msi' Automobile-Engine-Windows-x64.msi
          one '*.dmg' Automobile-Engine-macOS-universal.dmg
          one '*.AppImage' Automobile-Engine-Linux-x64.AppImage
          one '*.deb' Automobile-Engine-Linux-x64.deb
          one '*.rpm' Automobile-Engine-Linux-x64.rpm
          chmod +x Automobile-Engine-Linux-x64.AppImage
          ASSETS=(Automobile-Engine-Windows-x64.exe Automobile-Engine-Windows-x64.msi Automobile-Engine-macOS-universal.dmg Automobile-Engine-Linux-x64.AppImage Automobile-Engine-Linux-x64.deb Automobile-Engine-Linux-x64.rpm)
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Automated development distribution from tested source $TESTED_SHA.

          Quality Gate: $QUALITY_URL

          Windows x64 (.exe installer and .msi), universal macOS (.dmg for Apple silicon and Intel) and Linux x64 (.AppImage, .deb, .rpm) installers. Unsigned development builds: signing, notarization and installed HTTPS/Cognito acceptance remain pending. An activated dealership backend is required. These are installers, not a provisioned backend or a production-certified release.

          Verify SHA-256 against the attached SHA256SUMS.txt before installation.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already published; keeping immutable assets.'
            exit 0
          fi
          gh release create "$tag" --target "$TESTED_SHA" --title "Automobile Engine development ${TESTED_SHA:0:12}" --prerelease --notes-file release-notes.md "${ASSETS[@]}" SHA256SUMS.txt
          # A rolling release with fixed file names, so the download links on the install page never change.
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest --clobber "${ASSETS[@]}" SHA256SUMS.txt
            gh release edit desktop-latest --notes-file release-notes.md --prerelease
          else
            gh release create desktop-latest --target "$TESTED_SHA" --title "Automobile Engine: latest development build" --prerelease --notes-file release-notes.md "${ASSETS[@]}" SHA256SUMS.txt
          fi
