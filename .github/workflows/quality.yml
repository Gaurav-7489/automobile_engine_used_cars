name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Demo launcher preflight
        run: node scripts/start-demo.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Staff security regression tests
        run: pnpm test:security

      - name: PostgreSQL persistence regressions
        run: pnpm test:database

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: pnpm test:e2e --project=desktop

      - name: Staff HTTP access regression tests
        run: pnpm test:auth:e2e

      - name: Build AWS infrastructure
        working-directory: infra/aws
        run: |
          npm install
          npm run build

      - name: CDK synth
        working-directory: infra/aws
        run: npx cdk synth -c environment=staging
