name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Demo launcher preflight
        run: node scripts/start-demo.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Staff security regression tests
        run: pnpm test:security

      - name: PostgreSQL persistence regressions
        run: pnpm test:database

      - name: Evidence and matching regressions
        run: pnpm test:intelligence

      - name: Product UI acceptance regressions
        run: pnpm test:product

      - name: Intelligence production data, identity and tenant isolation
        run: pnpm test:intelligence-prod

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end smoke tests
        run: pnpm test:e2e

      - name: Staff HTTP access regression tests
        run: pnpm test:auth:e2e

      - name: Signed staff role browser and HTTP regressions
        run: pnpm test:roles:e2e

      - name: Cloudflare admission and runtime regressions
        run: pnpm test:cloudflare

      - name: Build the unified local gateway
        run: pnpm --filter @vandlabs/intelligence build
        env:
          SHOWROOM_ORIGIN: http://127.0.0.1:3000

      - name: Unified showroom, login and installation browser checks
        run: pnpm exec playwright test --config playwright.unified.config.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            test-results/
            auth-test-results/
            role-test-results/
          if-no-files-found: ignore
