name: Staff identity infrastructure
on:
  pull_request:
    paths:
      - infra/aws/**
      - .github/workflows/staff-identity.yml
  push:
    branches: [main]
    paths:
      - infra/aws/**
      - .github/workflows/staff-identity.yml
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:identity
      - run: npm run identity:synth -- -c environment=staging -c publicOrigin=https://vandlabs-staging-gateway.vandlabs-automobile.workers.dev
        env:
          CDK_DEFAULT_ACCOUNT: '111122223333'
          CDK_DEFAULT_REGION: ap-south-1
