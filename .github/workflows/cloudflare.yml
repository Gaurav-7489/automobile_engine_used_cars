name: Cloudflare build and deploy
# One Worker: apps/intelligence. Vercel stays the live host until the acceptance list in
# docs/CLOUDFLARE_MIGRATION_AND_ROLLBACK.md passes; deploys run only by hand.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
        description: Isolated deployment environment
      deploy:
        type: boolean
        default: false
        description: Deploy the Intelligence Worker
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cloudflare
      # The OpenNext adapter rejects Next.js 15.5.27 unless an override flag is passed. Building (and so
      # deploying) the Worker waits for that decision; see docs/CLOUDFLARE_MIGRATION_AND_ROLLBACK.md.
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (inputs.target == 'staging' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:deploy
