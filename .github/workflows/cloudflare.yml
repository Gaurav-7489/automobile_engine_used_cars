name: Cloudflare build and deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare.yml
      - scripts/cloudflare/preflight.mjs
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - staging
          - production
        default: staging
        description: Isolated deployment environment
      deploy:
        type: boolean
        default: false
        description: Deploy configured Cloudflare environment
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment credentials and required configuration (read-only)
        run: node scripts/cloudflare/preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PREFLIGHT_ACCOUNT_ID: 98f548fdf2e2be84591c6669493f330b
          CF_PUBLIC_ORIGIN: ${{ vars.CF_PUBLIC_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENANT_CONFIG_JSON: ${{ secrets.TENANT_CONFIG_JSON }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AUTH_PRINCIPALS_JSON: ${{ secrets.AUTH_PRINCIPALS_JSON }}
          AUTH_MODE: ${{ vars.AUTH_MODE || 'oidc' }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ secrets.OIDC_AUDIENCE }}
          OIDC_JWKS_URL: ${{ secrets.OIDC_JWKS_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_AUTHORIZE_URL: ${{ secrets.OIDC_AUTHORIZE_URL }}
          OIDC_TOKEN_URL: ${{ secrets.OIDC_TOKEN_URL }}
          OIDC_REVOKE_URL: ${{ secrets.OIDC_REVOKE_URL }}
  build:
    needs: preflight
    if: always() && github.event_name != 'push' && (github.event_name == 'pull_request' || needs.preflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cloudflare && pnpm typecheck
      - run: pnpm cf:build
        env:
          DATA_MODE: demo
          AUTH_MODE: demo
          NEXT_PUBLIC_PREVIEW_READ_ONLY: 'true'
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (inputs.target == 'staging' || github.ref == 'refs/heads/main')
    needs: [build, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ENVIRONMENT: ${{ inputs.target }}
      SEO_INDEXABLE: 'false'
      CF_PUBLIC_ORIGIN: ${{ vars.CF_PUBLIC_ORIGIN }}
      CF_SHARED_DATA: 'true'
      HOSTING_PROVIDER: cloudflare
      DATA_MODE: neon
      AUTH_MODE: ${{ vars.AUTH_MODE || 'oidc' }}
      AUTH_REGISTRY_MODE: database
      APP_ORIGIN: ${{ vars.CF_PUBLIC_ORIGIN }}
      NEXT_PUBLIC_PREVIEW_READ_ONLY: 'false'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TENANT_CONFIG_JSON: ${{ secrets.TENANT_CONFIG_JSON }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      AUTH_PRINCIPALS_JSON: ${{ secrets.AUTH_PRINCIPALS_JSON }}
      COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      COGNITO_CLIENT_IDS: ${{ secrets.COGNITO_CLIENT_IDS }}
      COGNITO_DESKTOP_CLIENT_ID: ${{ secrets.COGNITO_DESKTOP_CLIENT_ID }}
      OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ secrets.OIDC_AUDIENCE }}
      OIDC_JWKS_URL: ${{ secrets.OIDC_JWKS_URL }}
      OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
      OIDC_AUTHORIZE_URL: ${{ secrets.OIDC_AUTHORIZE_URL }}
      OIDC_TOKEN_URL: ${{ secrets.OIDC_TOKEN_URL }}
      OIDC_REVOKE_URL: ${{ secrets.OIDC_REVOKE_URL }}
      OIDC_DESKTOP_CLIENT_ID: ${{ secrets.OIDC_DESKTOP_CLIENT_ID }}
      DEALER_AI_URL: ${{ vars.DEALER_AI_URL }}
      DEALER_AI_SERVICE_TOKEN: ${{ secrets.DEALER_AI_SERVICE_TOKEN }}
      DEALER_AI_SERVICE_TOKEN_ALTERNATE: ${{ secrets.DEALER_AI_SERVICE_TOKEN_ALTERNATE }}
      DEALER_AI_PUBLIC: ${{ vars.DEALER_AI_PUBLIC }}
      VANDLABS_FEEDS_JSON: ${{ secrets.VANDLABS_FEEDS_JSON }}
      VANDLABS_FEED_TOKENS_JSON: ${{ secrets.VANDLABS_FEED_TOKENS_JSON }}
      GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM: ${{ vars.NOTIFICATION_FROM }}
      NOTIFICATION_TO: ${{ vars.NOTIFICATION_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:configure
      - run: pnpm cf:build
      - run: pnpm cf:deploy
